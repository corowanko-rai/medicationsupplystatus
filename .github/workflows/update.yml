name: 医薬品供給状況の自動更新

on:
  schedule:
    # UTC 22:00 = JST 翌07:00（毎日）
    - cron: '0 22 * * *'
  workflow_dispatch:        # 手動実行も可能
    inputs:
      force:
        description: '変更がなくても強制再生成'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージのインストール
        run: pip install pandas openpyxl

      - name: 更新チェックと生成
        id: run
        run: |
          set +e
          python fetch_update.py ${{ inputs.force && '--force' || '' }}
          code=$?
          set -e
          echo "code=$code" >> $GITHUB_OUTPUT
          if [ $code -eq 1 ]; then
            echo "::error::更新処理に失敗しました"
            exit 1
          fi
          if [ $code -eq 10 ]; then
            echo "::notice::変更なし。サイトは更新しません。"
          fi

      - name: 公開用ディレクトリを準備
        if: steps.run.outputs.code == '0'
        run: |
          mkdir -p public
          cp 医薬品供給状況_検索.html public/index.html

      - name: 状態ファイルとスナップショットをコミット
        if: steps.run.outputs.code == '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json snapshot.json
          git diff --staged --quiet || git commit -m "更新: $(date -u +%Y-%m-%d)"
          git push

      # GitHubは「リポジトリに60日間更新が無い」と定期実行を自動停止する。
      # 厚労省の更新が長く途絶えても止まらないよう、
      # 最終コミットから KEEPALIVE_DAYS 日以上経っていれば空コミットを打つ。
      - name: 定期実行の自動停止を防ぐ（キープアライブ）
        if: always()
        env:
          KEEPALIVE_DAYS: '20'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true

          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          DAYS=$(( (NOW - LAST) / 86400 ))
          echo "最終コミットから ${DAYS} 日経過（しきい値 ${KEEPALIVE_DAYS} 日）"

          if [ "$DAYS" -ge "$KEEPALIVE_DAYS" ]; then
            date -u +"last-alive: %Y-%m-%dT%H:%M:%SZ" > .keepalive
            git add .keepalive
            git commit -m "keepalive: 定期実行の維持（${DAYS}日ぶり）" || true
            git push || true
            echo "::notice::キープアライブのコミットを実行しました。"
          else
            echo "コミットは不要です。"
          fi

      - uses: actions/configure-pages@v5
        if: steps.run.outputs.code == '0'

      - uses: actions/upload-pages-artifact@v3
        if: steps.run.outputs.code == '0'
        with:
          path: public

      - uses: actions/deploy-pages@v4
        if: steps.run.outputs.code == '0'
