<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>医薬品供給状況 検索</title>
<style>
:root{
  --bg:#f7f9fb; --surface:#ffffff; --surface2:#eef2f7; --line:#dde5ee;
  --ink:#16202b; --ink2:#4d6070; --ink3:#7d8fa1;
  /* status colors: darkened for AA contrast on white */
  --ok:#0a6b40; --warn:#855400; --stop:#b52424; --accent:#0a68b0;
  --pur:#5f34ab;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
  font-size:15px; line-height:1.6; overscroll-behavior-y:none;
}
/* ---------- Header ---------- */
header{
  position:sticky; top:0; z-index:50; background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
  box-shadow:0 1px 3px rgba(16,32,48,.05);
  padding:calc(env(safe-area-inset-top) + 10px) 12px 0;
}
.brand{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.brand h1{font-size:16px;font-weight:700;margin:0;letter-spacing:.02em}
.brand .date{font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
.elapsed{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;
  white-space:nowrap;font-variant-numeric:tabular-nums;margin-left:auto}
.elapsed.fresh{background:#e3f6ec;color:var(--ok)}
.elapsed.mid{background:var(--surface2);color:var(--ink2)}
.elapsed.old{background:#fdf0d9;color:var(--warn)}
.brand{flex-wrap:wrap}
/* ---- 画面切り替えタブ ---- */
.ptabs{display:flex;gap:6px;margin-bottom:9px}
.ptab{flex:1;min-height:44px;padding:6px;border-radius:11px;font-size:14px;font-weight:800;
  background:var(--surface2);border:1px solid var(--line);color:var(--ink3);
  cursor:pointer;font-family:inherit;display:flex;align-items:center;
  justify-content:center;gap:6px;transition:.15s}
.ptab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.ptbadge{display:none;min-width:20px;height:20px;padding:0 6px;border-radius:999px;
  background:#e8734a;color:#fff;font-size:11px;font-weight:800;
  align-items:center;justify-content:center}
.ptbadge.on{display:inline-flex}
.ptab[aria-selected="true"] .ptbadge{background:rgba(255,255,255,.3)}
/* ---- お知らせ掲示板 ---- */
/* ---- 計算ページ ---- */
#calc{display:none;padding:0 0 calc(env(safe-area-inset-bottom) + 40px)}
#calc.on{display:block}
.cawrap{padding:12px 12px 0}
.canote{font-size:12px;line-height:1.75;color:var(--ink2);
  background:#f0f7fc;border:1px solid #cfe4f4;border-radius:11px;
  padding:11px 12px;margin-bottom:12px}
.canote b{color:#0a5a97}
.carow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.calbl{font-size:12.5px;font-weight:800;color:var(--ink2);flex:0 0 auto}
.caratio{display:flex;gap:5px;flex:1}
.carb{flex:1;min-height:40px;border-radius:9px;font-size:13px;font-weight:700;
  background:var(--surface);border:1px solid var(--line);color:var(--ink2);
  cursor:pointer;font-family:inherit}
.carb[aria-pressed="true"]{background:#0a68b0;border-color:#0a68b0;color:#fff}
/* 剤（Rp）のかたまり */
.carp{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:12px;margin-bottom:11px;box-shadow:0 1px 2px rgba(16,32,48,.04)}
.carph{display:flex;align-items:center;gap:9px;margin-bottom:10px;flex-wrap:wrap}
.carpt{font-size:13.5px;font-weight:800;color:var(--ink);flex:1;min-width:80px}
.carpx{min-height:34px;padding:0 11px;border-radius:8px;background:#fdecec;
  border:1px solid #f2c2c2;color:#b23c3c;font-size:11.5px;font-weight:700;
  cursor:pointer;font-family:inherit;flex:0 0 auto}
.cakind{display:flex;gap:5px;margin-bottom:10px}
.cakb{flex:1;min-height:36px;border-radius:8px;font-size:12px;font-weight:700;
  background:var(--surface2);border:1px solid var(--line);color:var(--ink3);
  cursor:pointer;font-family:inherit}
.cakb[aria-pressed="true"]{background:#e8f4ec;border-color:#8fcaa8;color:#2f7a52}
.cadays{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:12.5px;
  font-weight:700;color:var(--ink2);flex-wrap:wrap}
.cadays input{width:78px;min-height:38px;padding:0 9px;font-size:14px;
  border:1px solid var(--line);border-radius:8px;background:var(--surface);
  color:var(--ink);font-family:inherit;font-variant-numeric:tabular-nums}
/* 薬の1行 */
.cadrug{background:#fbfdff;border:1px solid var(--line);border-radius:10px;
  padding:10px;margin-bottom:8px}
.cadn{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:6px;
  word-break:break-word;display:flex;align-items:flex-start;gap:8px}
.cadn span{flex:1}
.cadx{min-height:30px;padding:0 9px;border-radius:7px;background:none;
  border:1px solid var(--line);color:var(--ink3);font-size:11px;cursor:pointer;
  font-family:inherit;flex:0 0 auto}
.cadq{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);
  flex-wrap:wrap}
.cadq input{width:76px;min-height:36px;padding:0 8px;font-size:14px;
  border:1px solid var(--line);border-radius:8px;background:var(--surface);
  color:var(--ink);font-family:inherit;font-variant-numeric:tabular-nums}
.cadinfo{font-size:11px;color:var(--ink3);margin-top:5px}
.cawarnrow{font-size:11px;line-height:1.6;color:#b23c3c;background:#fdecec;
  border:1px solid #f2c2c2;border-radius:7px;padding:6px 9px;margin-top:6px}
.catot{font-size:11.5px;font-weight:700;color:#0a5a97;background:#eef6fd;
  border-radius:7px;padding:3px 9px}
.caadddrug{width:100%;min-height:42px;border-radius:9px;background:#eef6fd;
  border:1px dashed #b9d8f0;color:#0a5a97;font-size:12.5px;font-weight:700;
  cursor:pointer;font-family:inherit;margin-top:2px}
.caadd{width:100%;min-height:48px;border-radius:11px;background:var(--surface);
  border:1px dashed var(--line);color:var(--ink2);font-size:13.5px;font-weight:700;
  cursor:pointer;font-family:inherit;margin-bottom:14px}
/* 結果 */
.cares{margin-bottom:20px}
.caresbox{background:#fdfaf5;border:1px solid #f0dcc4;border-radius:14px;padding:14px}
.carest{font-size:13px;font-weight:800;color:#8a4f08;margin-bottom:10px}
.careline{display:flex;justify-content:space-between;align-items:baseline;
  gap:10px;font-size:13px;padding:7px 0;border-bottom:1px solid #f0dcc4}
.careline:last-child{border-bottom:0}
.careline .k{color:var(--ink2)}
.careline .v{font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink)}
.caretotal{background:#fff;border:1px solid #f0dcc4;border-radius:10px;
  padding:11px 12px;margin-top:10px}
.caretotal .careline .v{font-size:17px;color:#8a4f08}
.cadetail{font-size:11px;color:var(--ink3);line-height:1.8;margin-top:9px;
  background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 10px}
.cawarn{font-size:11.5px;line-height:1.7;color:var(--ink2);background:#fff;
  border:1px solid var(--line);border-left:4px solid var(--warn);
  border-radius:9px;padding:10px 11px;margin-top:10px}
.caempty{text-align:center;padding:26px 16px;color:var(--ink3);font-size:13px;
  line-height:1.9}
/* 薬を選ぶ画面 */
#capick{position:fixed;inset:0;z-index:120;background:var(--bg);display:none;
  flex-direction:column}
#capick.on{display:flex}
.capq{padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.capq input{width:100%;min-height:44px;padding:0 12px;font-size:15px;
  border:1px solid var(--line);border-radius:10px;background:var(--surface2);
  color:var(--ink);font-family:inherit}
.capbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px}
.capitem{background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:10px 11px;margin-bottom:7px;cursor:pointer}
.capitem:active{background:var(--surface2)}
.capnm{font-size:13.5px;font-weight:700;color:var(--ink);word-break:break-word}
.capsub{font-size:11.5px;color:var(--ink3);margin-top:3px}
#board{display:none;padding:0 0 calc(env(safe-area-inset-bottom) + 40px)}
#board.on{display:block}
.bdwrap{padding:12px 12px 0}
.bdsec{background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:13px;margin-bottom:13px;box-shadow:0 1px 3px rgba(16,32,48,.05)}
.bdhd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  justify-content:space-between;margin-bottom:11px}
.bdhd h2{margin:0;font-size:14.5px;font-weight:800;color:var(--ink)}
.bdth{display:flex;gap:4px}
.thb{min-height:36px;padding:0 11px;border-radius:9px;font-size:12px;font-weight:700;
  background:var(--surface2);border:1px solid var(--line);color:var(--ink2);
  cursor:pointer;font-family:inherit}
.thb[aria-pressed="true"]{background:#e3f0fa;border-color:#8fc3e8;color:#0a5a97}
#chsel{flex:1;min-width:150px;min-height:38px;padding:0 10px;font-size:13px;
  background:var(--surface2);border:1px solid var(--line);border-radius:9px;color:var(--ink)}
.bdrow{border:1px solid var(--line);border-radius:13px;padding:11px 12px;margin-bottom:9px;
  background:linear-gradient(180deg,#ffffff,#fbfdff);cursor:pointer;transition:.15s}
.bdrow:active{background:#f2f8fd}
.bdrow.lv3{border-left:5px solid #e05c5c}
.bdrow.lv2{border-left:5px solid #e8934a}
.bdrow.lv1{border-left:5px solid #4aa3d8}
.bdtop{display:flex;gap:9px;align-items:baseline;margin-bottom:7px}
.bdnm{flex:1;font-size:13.5px;font-weight:800;line-height:1.45;word-break:break-word}
.bdpc{flex:0 0 auto;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.bdpc.lv3{color:#d14545}.bdpc.lv2{color:#d97b28}.bdpc.lv1{color:#3d8fc4}
.bdbar{display:flex;height:9px;border-radius:99px;overflow:hidden;background:#eef3f8}
.bdbar i{display:block;height:100%}
.bi-stop{background:linear-gradient(90deg,#e05c5c,#ee7b7b)}
.bi-lim{background:linear-gradient(90deg,#e8934a,#f2ad7f)}
.bi-ok{background:linear-gradient(90deg,#5cb98a,#7fcfa4)}
.bdmeta{display:flex;flex-wrap:wrap;gap:9px;font-size:11.5px;color:var(--ink3);margin-top:7px}
.bdmeta b{font-variant-numeric:tabular-nums}
.m-stop{color:#c94a4a}.m-lim{color:#c47a2a}.m-ok{color:#3f9268}
.bdw{display:inline-flex;align-items:center;font-size:10.5px;font-weight:800;
  padding:2px 8px;border-radius:99px;background:#fdeaea;color:#c33c3c;
  border:1px solid #f2b8b8;margin-left:7px}
.bdnote{font-size:12px;line-height:1.75;color:var(--ink2);
  background:#f0f7fc;border:1px solid #cfe4f4;border-radius:11px;
  padding:11px 12px;margin-bottom:12px}
.bdnote b{color:#0a5a97}
.bdgo{font-size:11.5px;font-weight:700;color:#0a5a97;background:#eef6fd;
  border:1px solid #b9d8f0;border-radius:8px;padding:7px 10px;margin-top:8px;
  text-align:center}
.bdsub{font-size:12px;font-weight:800;color:#c33c3c;padding:10px 3px 7px;
  border-bottom:1px solid #f2d6d6;margin-bottom:9px}
.bdcnt{font-size:12px;font-weight:700;color:var(--ink3);
  background:var(--surface2);border-radius:99px;padding:3px 11px}
.kwrap{display:flex;gap:5px;margin-bottom:8px}
.kb2{flex:1;min-height:38px;border-radius:9px;font-size:12.5px;font-weight:700;
  background:var(--surface2);border:1px solid var(--line);color:var(--ink3);
  cursor:pointer;font-family:inherit}
.kb2[aria-pressed="true"]{background:#e8f4ec;border-color:#8fcaa8;color:#2f7a52}
.thwrap{background:var(--surface2);border-radius:11px;padding:9px;margin-bottom:11px}
.bdth{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.thb{flex:1;min-width:74px;min-height:34px;padding:0 6px;border-radius:8px;
  font-size:11.5px;font-weight:700;background:var(--surface);
  border:1px solid var(--line);color:var(--ink2);cursor:pointer;font-family:inherit}
.thb[aria-pressed="true"]{background:#e3f0fa;border-color:#8fc3e8;color:#0a5a97}
.rngrow{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink2)}
.rngrow label{white-space:nowrap}
.rngrow b{color:#0a5a97;font-variant-numeric:tabular-nums}
#rng{flex:1;min-height:32px;accent-color:#0a68b0}
/* 上段は高さを決めてスクロールさせ、下段のグラフを常に見せる */
.bdscroll{max-height:44vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-right:2px}
.kbadge{display:inline-flex;align-items:center;justify-content:center;
  min-width:20px;height:18px;padding:0 5px;border-radius:5px;font-size:10.5px;
  font-weight:800;margin-left:5px;border:1.5px solid currentColor}
.kb-nai{color:#2f7a52}
.kb-gai{color:#a5641d}
.kb-chu{color:#5b52a8}
/* 折りたたみ設定 */
.cfg{border:1px solid var(--line);border-radius:11px;background:var(--surface2);
  margin-bottom:11px;overflow:hidden}
.cfg summary{min-height:42px;display:flex;align-items:center;padding:0 12px;
  font-size:12.5px;font-weight:700;color:var(--ink2);cursor:pointer;list-style:none}
.cfg summary::-webkit-details-marker{display:none}
.cfg summary::before{content:'▸';margin-right:7px;font-size:11px;color:var(--ink3)}
.cfg[open] summary::before{content:'▾'}
.cfgin{padding:2px 12px 12px}
.cfglb{font-size:11px;font-weight:800;color:var(--ink3);margin:9px 0 5px}
/* お知らせ掲示板 */
.nwbar{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.nwsort{min-height:34px;padding:0 12px;border-radius:8px;font-size:12px;font-weight:700;
  background:var(--surface2);border:1px solid var(--line);color:var(--ink2);
  cursor:pointer;font-family:inherit;white-space:nowrap}
.nwkinds{flex:1;font-size:11px;color:var(--ink3);text-align:right}
.nwtabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:9px;scrollbar-width:none}
.nwtabs::-webkit-scrollbar{display:none}
.nwt{flex:0 0 auto;min-height:34px;padding:0 12px;border-radius:99px;
  font-size:12px;font-weight:700;background:var(--surface2);
  border:1px solid var(--line);color:var(--ink2);cursor:pointer;font-family:inherit;
  white-space:nowrap}
.nwt[aria-pressed="true"]{background:#0a68b0;border-color:#0a68b0;color:#fff}
.nwrow{display:flex;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);
  cursor:pointer;align-items:flex-start}
.nwrow:last-child{border-bottom:0}
.nwic{flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:flex;
  align-items:center;justify-content:center;font-size:14px;font-weight:800}
.ic-cross{background:#fdecec;color:#c0392b}
.ic-rise{background:#fff3e2;color:#b5741a}
.ic-down{background:#f3ecfb;color:#6b3fa0}
.ic-swing{background:#e7f4f6;color:#1f7d86}
.nwbody{flex:1;min-width:0}
.nwtxt{font-size:13px;line-height:1.6;word-break:break-word}
.nwtxt b{font-weight:800}
.nwsub{font-size:11px;color:var(--ink3);margin-top:3px}
.nwtag{display:inline-block;font-size:10px;font-weight:800;padding:1px 7px;
  border-radius:99px;margin-right:6px;vertical-align:1px}
.tg-cross{background:#fdecec;color:#c0392b}
.tg-rise{background:#fff3e2;color:#b5741a}
.tg-down{background:#f3ecfb;color:#6b3fa0}
.tg-swing{background:#e7f4f6;color:#1f7d86}
#chsel{width:100%;margin-bottom:10px}
.fcbar{display:flex;align-items:center;justify-content:space-between;gap:9px;
  background:#e8f2fb;border:1px solid #b9d8f0;border-radius:10px;
  padding:8px 11px;margin-bottom:9px;font-size:12px;font-weight:700;color:#0a5a97}
.fcx{min-height:32px;padding:0 11px;border-radius:8px;background:#fff;
  border:1px solid #b9d8f0;color:#0a5a97;font-size:11.5px;font-weight:700;
  cursor:pointer;font-family:inherit;flex:0 0 auto}
.bdempty{text-align:center;padding:34px 16px;color:var(--ink3);font-size:13.5px;line-height:1.9}
#chart svg{width:100%;height:auto;display:block}
.chleg{display:flex;gap:14px;justify-content:center;padding:9px 0 2px;font-size:12px}
.chleg span{display:inline-flex;align-items:center;gap:6px;color:var(--ink2)}
.chkey{width:16px;height:3px;border-radius:2px;flex:0 0 auto}
.chkey.dash{background-image:repeating-linear-gradient(90deg,
  currentColor 0 5px,transparent 5px 8px)}
.smode{display:flex;gap:0;margin-bottom:8px;background:var(--surface2);
  border:1px solid var(--line);border-radius:10px;padding:3px}
.sm{flex:1;min-height:44px;padding:4px;border:0;border-radius:8px;font-size:13px;font-weight:700;
  background:none;color:var(--ink3);cursor:pointer;font-family:inherit;transition:.15s}
.sm[aria-pressed="true"]{background:var(--surface);color:var(--accent);
  box-shadow:0 1px 2px rgba(16,32,48,.08)}
.searchwrap{position:relative;margin-bottom:8px}
#q{
  width:100%; padding:13px 40px 13px 40px; font-size:16px;
  background:var(--surface2); border:1px solid var(--line);
  border-radius:var(--r); color:var(--ink); outline:none;
}
#q:focus{background:var(--surface)}
#q:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(11,116,196,.14)}
#q::placeholder{color:var(--ink3)}
.sicon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:16px;pointer-events:none}
#clr{
  position:absolute;right:5px;top:50%;transform:translateY(-50%);
  width:40px;height:40px;border:0;border-radius:50%;background:var(--surface2);
  color:var(--ink2);font-size:18px;cursor:pointer;display:none;line-height:1
}
#clr.on{display:block}
/* ---------- Filter chips ---------- */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;
  background:var(--surface);border:1px solid var(--line);color:var(--ink2);cursor:pointer;
  white-space:nowrap;transition:.15s;display:inline-flex;align-items:center
}
.chips{align-items:center}
/* フィルターの並び替え */
.chiporder{display:flex;justify-content:flex-end;padding:0 0 8px}
.cobtn{min-height:32px;padding:0 11px;border-radius:8px;background:none;
  border:0;color:var(--ink3);font-size:11.5px;font-weight:700;cursor:pointer;
  font-family:inherit;text-decoration:underline}
#coedit{display:none;background:var(--surface2);border:1px solid var(--line);
  border-radius:12px;padding:12px;margin-bottom:10px}
#coedit.on{display:block}
.coh{font-size:12.5px;font-weight:800;color:var(--ink);margin-bottom:3px}
.cohelp{font-size:11px;color:var(--ink3);margin-bottom:9px;line-height:1.6}
.coitem{display:flex;align-items:center;gap:8px;background:var(--surface);
  border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:6px}
.coname{flex:1;font-size:13px;font-weight:700;color:var(--ink)}
.coar{min-width:40px;min-height:36px;border-radius:8px;background:var(--surface2);
  border:1px solid var(--line);color:var(--ink2);font-size:14px;cursor:pointer;
  font-family:inherit;flex:0 0 auto}
.coar:disabled{opacity:.35;cursor:default}
.corow{display:flex;gap:7px;margin-top:9px}
.cobk{flex:1;min-height:42px;border-radius:9px;background:var(--surface);
  border:1px solid var(--line);color:var(--ink2);font-size:13px;font-weight:700;
  cursor:pointer;font-family:inherit}
.cobk.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.glabel{flex:0 0 auto;font-size:11px;color:var(--ink3);font-weight:700;padding:0 1px 0 2px;white-space:nowrap}
.gdiv{flex:0 0 auto;width:1px;height:20px;background:var(--line);margin:0 3px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.w[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#fff}
.chip.s[aria-pressed="true"]{background:var(--stop);border-color:var(--stop);color:#fff}
.chip.n[aria-pressed="true"]{background:var(--pur);border-color:var(--pur);color:#fff}
.chip.o[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.ex[aria-pressed="true"]{background:var(--ink2);border-color:var(--ink2);color:#fff}
.chip.exn[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#fff}
.chip.exo[aria-pressed="true"]{background:var(--stop);border-color:var(--stop);color:#fff}
.chip.cm{color:#2a5599;border-color:#a9c2e4}
.chip.cm:active{background:#e8f0fb}
.chip.sn[aria-pressed="true"]{background:#a85f10;border-color:#a85f10;color:#fff}
.chip.dc[aria-pressed="true"]{background:#2b3947;border-color:#2b3947;color:#fff}
.chip.dn[aria-pressed="true"]{background:var(--stop);border-color:var(--stop);color:#fff}
.chip.up[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.logic{flex:0 0 auto;min-height:44px;padding:0 12px;border-radius:8px;font-size:12px;font-weight:800;
  align-items:center;
  background:var(--surface2);border:1px dashed var(--ink3);color:var(--ink2);
  cursor:pointer;white-space:nowrap;font-family:inherit;display:none}
.logic.on{display:inline-flex}
.logic[data-mode="and"]{background:var(--ink2);border-style:solid;border-color:var(--ink2);color:#fff}
/* ---------- Advanced ---------- */
#adv{display:none;gap:8px;padding-bottom:10px;flex-direction:column}
#adv.on{display:flex}
#adv select{
  width:100%;min-height:46px;padding:11px;font-size:15px;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;color:var(--ink);outline:none
}
.active{display:none;flex-wrap:wrap;gap:6px;align-items:center;padding:0 0 10px}
.active.on{display:flex}
.active .lbl{font-size:11px;color:var(--ink3);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;
  min-height:40px;padding:0 4px 0 11px;border-radius:999px;background:var(--surface2);
  border:1px solid var(--line);color:var(--ink2)}
.pill b{font-weight:700;color:var(--ink)}
.active .join{font-size:11px;font-weight:800;color:var(--ink3);padding:0 1px}
.pill .x{cursor:pointer;color:var(--ink3);font-size:15px;line-height:1;
  width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:50%;flex:0 0 auto}
.clrall{background:none;border:0;color:var(--accent);font-size:12px;font-weight:700;
  cursor:pointer;text-decoration:underline;padding:0 6px;min-height:40px;font-family:inherit}
.advbtn{
  display:flex;align-items:center;width:100%;min-height:44px;
  background:none;border:0;color:var(--ink3);font-size:12.5px;padding:0;margin-bottom:4px;
  cursor:pointer;text-align:left;font-family:inherit
}
/* ---------- Count bar ---------- */
.nochg{display:none;margin:0;padding:10px 14px;font-size:12px;line-height:1.7;
  background:#fdf6e8;border-bottom:1px solid var(--line);color:#6b4a00}
.nochg.on{display:block}
.count{
  padding:0 10px 0 14px;min-height:44px;font-size:12px;color:var(--ink3);
  border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;
  display:flex;justify-content:space-between;align-items:center
}
.count b{color:var(--accent);font-size:14px}
.count.sub{justify-content:flex-start;gap:2px;padding:0 8px;min-height:40px;
  background:var(--surface)}
.count.sub .lgbtn{min-height:40px}
.ordbtn{min-height:44px;padding:0 8px;background:none;border:0;color:var(--ink2);
  font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;
  white-space:nowrap;text-decoration:underline;margin-left:auto}
.cbtns{display:flex;align-items:center;gap:2px;flex:0 0 auto}
/* 検索結果の見出し（成分名・規格でまとめる） */
.rgrp{font-size:12px;font-weight:800;color:var(--ink2);padding:14px 4px 6px;
  border-bottom:1px solid var(--line);margin-bottom:8px;
  display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rgrp .cnt{font-size:11px;font-weight:700;color:var(--ink3);white-space:nowrap;
  background:var(--surface2);border-radius:999px;padding:2px 9px;flex:0 0 auto}
.rgrp>span:first-child{flex:1;min-width:0}
.rsub{font-size:11.5px;font-weight:700;color:var(--ink3);
  padding:8px 4px 4px 10px;border-left:2px solid var(--line);margin:4px 0 6px}
.cmvb{color:#2a5599!important}
.rvb{color:var(--stop)!important}
.lgbtn{min-height:44px;padding:0 7px;background:none;border:0;
  color:var(--accent);font-size:12px;font-weight:700;cursor:pointer;
  font-family:inherit;white-space:nowrap;text-decoration:underline}
/* ---------- 凡例 ---------- */
#al{position:fixed;inset:0;z-index:110;background:var(--bg);display:none;flex-direction:column}
#al.on{display:flex}
.alb{color:var(--warn)!important}
/* お知らせの1件 */
.alrow{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:11px 12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(16,32,48,.04);cursor:pointer}
.alrow.hot{border-left:4px solid var(--stop)}
.alrow.warnb{border-left:4px solid var(--warn)}
.alhead{display:flex;gap:9px;align-items:baseline;margin-bottom:6px}
.alnm{flex:1;font-size:13.5px;font-weight:800;line-height:1.45;word-break:break-word}
.alpct{flex:0 0 auto;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.alpct.hot{color:var(--stop)}
.alpct.warnb{color:var(--warn)}
/* 積み上げ棒 */
.albar{display:flex;height:16px;border-radius:5px;overflow:hidden;background:var(--surface2);
  border:1px solid var(--line)}
.albar i{display:block;height:100%}
.b-stop{background:var(--stop)}
.b-lim{background:var(--warn)}
.b-ok{background:var(--ok);opacity:.55}
.almeta{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--ink3);margin-top:5px}
.almeta b{color:var(--ink2)}
.alw{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:5px;
  background:var(--stop);color:#fff;margin-left:6px}
.alnote{font-size:12px;color:var(--ink2);line-height:1.75;
  background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--warn);
  border-radius:11px;padding:12px;margin:10px 0 14px}
.alsec{font-size:12px;font-weight:800;color:var(--ink3);padding:14px 3px 7px;
  border-bottom:1px solid var(--line);margin-bottom:9px}
#cmv{position:fixed;inset:0;z-index:110;background:var(--bg);display:none;flex-direction:column}
#cmv.on{display:flex}
.cmvg{background:var(--surface);border:1px solid var(--line);border-radius:13px;
  margin-bottom:10px;overflow:hidden}
.cmvg summary{min-height:48px;display:flex;align-items:center;gap:9px;
  padding:9px 12px;cursor:pointer;list-style:none;flex-wrap:wrap}
.cmvg summary::-webkit-details-marker{display:none}
.cmvg summary::before{content:'▸';color:var(--ink3);font-size:12px;flex:0 0 auto}
.cmvg[open] summary::before{content:'▾'}
.cmvi{flex:1;min-width:120px;font-size:13.5px;font-weight:800;color:var(--ink);
  word-break:break-word}
.cmvn{font-size:11px;color:var(--ink3);background:var(--surface2);
  border-radius:99px;padding:2px 9px;flex:0 0 auto}
.cmvwarn{font-size:10.5px;font-weight:800;color:#b23c3c;background:#fdecec;
  border:1px solid #f2c2c2;border-radius:99px;padding:2px 8px;flex:0 0 auto}
.cmvbody{padding:0 12px 11px}
.cmvsp{font-size:11px;font-weight:800;color:var(--ink3);
  padding:8px 2px 5px;border-bottom:1px solid var(--line);margin-bottom:7px}
#rv{position:fixed;inset:0;z-index:110;background:var(--bg);display:none;flex-direction:column}
#rv.on{display:flex}
/* 逆転一覧 */
.rvtools{display:flex;gap:6px;padding:9px 12px 0;align-items:center}
.rvsw{position:relative;flex:1;min-width:0}
.rvsw .sicon{position:absolute;left:11px;top:50%;transform:translateY(-50%);
  color:var(--ink3);font-size:14px;pointer-events:none}
#rvq{width:100%;min-height:44px;padding:0 38px 0 34px;font-size:15px;
  background:var(--surface2);border:1px solid var(--line);border-radius:10px;
  color:var(--ink);outline:none}
#rvq:focus{background:var(--surface);border-color:var(--accent)}
#rvqx{position:absolute;right:4px;top:50%;transform:translateY(-50%);
  width:36px;height:36px;border:0;border-radius:50%;background:var(--surface2);
  color:var(--ink2);font-size:17px;cursor:pointer;display:none;line-height:1}
#rvqx.on{display:block}
.rvord{flex:0 0 auto;min-width:96px}
.rvgrp{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:12px 13px;margin-bottom:10px;box-shadow:0 1px 2px rgba(16,32,48,.04)}
.rvhd{display:flex;gap:9px;align-items:flex-start;padding-bottom:9px;
  border-bottom:1px dashed var(--line);margin-bottom:9px}
.rvnm{flex:1;font-size:13.5px;font-weight:800;line-height:1.45;word-break:break-word}
.rvnm .rvsub{display:block;font-size:11.5px;color:var(--ink3);font-weight:600;margin-top:2px}
.rvyen{flex:0 0 auto;text-align:right;font-size:14px;font-weight:800;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.rvyen small{display:block;font-size:10px;color:var(--ink3);font-weight:600}
.rvg{display:flex;gap:9px;align-items:flex-start;padding:6px 0}
.rvg .m{flex:1;min-width:0}
.rvg .gn{font-size:12.5px;line-height:1.45;word-break:break-word}
.rvg .gs{font-size:11px;color:var(--ink3);margin-top:1px}
.rvg .gy{flex:0 0 auto;text-align:right;font-size:13px;font-weight:800;color:var(--stop);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.rvg .gy small{display:block;font-size:10px;font-weight:700}
.rvempty{text-align:center;padding:50px 20px;color:var(--ink3);font-size:14px;line-height:1.8}
#lg{position:fixed;inset:0;z-index:110;background:var(--bg);display:none;flex-direction:column}
#lg.on{display:flex}
.lgb{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:4px 14px calc(env(safe-area-inset-bottom) + 30px)}
.lgsec{font-size:12px;font-weight:800;color:var(--ink3);padding:16px 0 7px;
  border-bottom:1px solid var(--line);margin-bottom:9px}
.lgrow{display:flex;gap:11px;align-items:flex-start;padding:6px 0}
.lgk{flex:0 0 78px;display:flex;justify-content:flex-start;padding-top:1px}
.lgv{flex:1;font-size:13px;line-height:1.6;color:var(--ink);word-break:break-word}
.lgv small{display:block;color:var(--ink3);font-size:11.5px;margin-top:1px}
.srcrow{display:flex;gap:10px;align-items:baseline;padding:7px 0 1px}
.srcn{flex:1;font-size:13px;line-height:1.5;word-break:break-word}
.srcd{flex:0 0 auto;font-size:13px;font-weight:800;color:var(--accent);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.srcf{font-size:11px;color:var(--ink3);padding:0 0 6px;
  border-bottom:1px solid var(--line);margin-bottom:2px;word-break:break-all}
.lgnote{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);
  border-radius:11px;padding:12px 13px;margin:12px 0 2px;font-size:12.5px;line-height:1.75;color:var(--ink2)}
.lgnote b{color:var(--ink)}
.lgbar{display:inline-block;width:5px;height:20px;border-radius:3px;vertical-align:middle}
/* ---------- Cards ---------- */
#list{padding:10px 12px calc(env(safe-area-inset-bottom) + 70px)}
.card{
  background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ink3);
  border-radius:var(--r);padding:13px 14px;margin-bottom:9px;cursor:pointer;
  box-shadow:0 1px 2px rgba(16,32,48,.04)
}
.card:active{background:#fbfcfe}
.card.s0{border-left-color:var(--ok)}
.card.s1{border-left-color:var(--warn)}
.card.s2{border-left-color:var(--stop)}
.card.disc{background:repeating-linear-gradient(135deg,
  var(--surface),var(--surface) 9px,#f4f6f9 9px,#f4f6f9 18px)}
.tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:7px}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;white-space:nowrap}
.b0{background:#e3f6ec;color:var(--ok)}
.b1{background:#fdf0d9;color:var(--warn)}
.b2{background:#fde8e8;color:var(--stop)}
.b3{background:var(--surface2);color:var(--ink2)}
.bnew{background:var(--pur);color:#fff}
.bdisc{background:#2b3947;color:#fff}
.bdisc.part{background:#4a5a6b}
.pkwarn{font-size:11px;color:var(--warn);line-height:1.6;margin:3px 0 5px}
.pkrow{display:flex;gap:8px;align-items:baseline;padding:3px 0;
  border-top:1px dotted var(--line)}
.pkn{flex:1;font-size:12px;word-break:break-all}
.pkd{flex:0 0 auto;font-size:11.5px;font-weight:700;color:var(--stop);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.pkmeta{font-size:11.5px;color:var(--ink3);margin-top:4px}
.bworse{background:var(--stop);color:#fff}
.bbetter{background:var(--ok);color:#fff}
.kind{font-size:11px;color:var(--ink3);padding:3px 7px;background:var(--surface2);border-radius:6px}
.nm{font-size:15px;font-weight:700;line-height:1.4;margin-bottom:3px;word-break:break-word}
.sub{font-size:12.5px;color:var(--ink2);word-break:break-word}
.sub .sep{color:var(--ink3);margin:0 5px}
.pcb{display:inline-flex;align-items:center;justify-content:center;
  min-width:26px;height:20px;padding:0 5px;border-radius:5px;font-size:11px;font-weight:800;
  border:1.5px solid currentColor;white-space:nowrap;flex:0 0 auto}
.jpm{font-size:9px;font-weight:800;margin-left:1px;opacity:.85}
.pc-sen{color:#0a68b0}      /* 先発品 */
.pc-kou{color:#c2185b}      /* 後発品 */
.pc-jun{color:#00838f}      /* 準先発品 */
.pc-cho{color:#5f34ab}      /* 長期収載品 */
.pc-hoka{color:#7d8fa1}     /* その他医薬品 */
.pc-mi{color:#855400}       /* 未収載医薬品 */
.kb{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;
  padding:0 5px;border-radius:5px;font-size:11px;font-weight:800;white-space:nowrap;flex:0 0 auto;
  background:#e8f1e9;color:#2f6b3a;border:1.5px solid #2f6b3a}
.sen{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;
  padding:0 5px;border-radius:5px;font-size:11px;font-weight:800;white-space:nowrap;flex:0 0 auto;
  background:#fdf0e3;color:#a85f10;border:1.5px solid #a85f10}
.senunit{font-size:11px;color:var(--ink3);margin-bottom:6px}
/* 併売品 */
.cmb{display:inline-flex;align-items:center;justify-content:center;height:20px;
  padding:0 6px;border-radius:5px;font-size:11px;font-weight:800;white-space:nowrap;
  flex:0 0 auto;background:#e8f0fb;color:#2a5599;border:1.5px solid #2a5599}
.cmnote{font-size:11px;color:var(--ink3);margin-bottom:6px;line-height:1.6}
.cmitem{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  background:#f4f8fd;border:1px solid #d3e2f3;border-radius:9px;
  padding:8px 10px;margin-bottom:6px;cursor:pointer}
.cmitem:active{background:#e7f0fa}
.cmst{flex:0 0 auto;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:5px}
.cmst.s0{background:#e8f5ec;color:#2f7a52}
.cmst.s1{background:#fdf0e0;color:#a5641d}
.cmst.s2{background:#fdecec;color:#b23c3c}
.cmnm{flex:1;min-width:130px;font-size:13px;font-weight:700;color:var(--ink);
  word-break:break-word}
.cmmk{font-size:11px;color:var(--ink3)}
/* 凡例内：選定療養の計算式・図解ブロック */
.sencalc{background:#fdfaf5;border:1px solid #f0dcc4;border-radius:13px;
  padding:15px 15px 16px;margin:4px 0 16px}
.sencalc-h{font-size:13px;font-weight:800;color:#8a4f08;margin-bottom:2px}
.sencalc-ex{font-size:11px;color:var(--ink3);margin-bottom:12px}
/* シンプルな縦積み：ラベル→数式の2行だけ */
.sc-step{padding:2px 0}
.sc-step.sc-final{background:#fff;border:1px solid #f0dcc4;border-radius:10px;
  padding:11px 12px;margin-top:2px}
.sc-step.sc-q{background:#eef6fd;border-color:#b9d8f0}
.sc-step.sc-q .sc-lab{color:#0a5a97}
.sc-lab{font-size:12.5px;font-weight:800;color:#8a4f08;margin-bottom:3px}
.sc-num{font-size:13px;color:var(--ink);line-height:1.7}
.sc-num b{color:#8a4f08}
.sc-num.sc-plus{color:var(--ink2);margin-top:1px}
.sc-arrow{text-align:center;color:#d6b077;font-size:15px;line-height:1;margin:6px 0}
.sc-tag{display:inline-block;font-size:10.5px;font-weight:800;color:#b23c3c;
  background:#fdecec;border:1px solid #f2c2c2;border-radius:99px;
  padding:2px 9px;margin-top:7px}
.sc-bar{width:100%;height:auto;display:block;margin:10px 0 2px}
.sennote2{font-size:11.5px;line-height:1.75;color:var(--ink2);
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:10px 11px;margin-top:14px}
.sennote2 b{color:#8a4f08}
.senbox{display:flex;flex-wrap:wrap;gap:6px}
.senbox>div{flex:1;min-width:118px;background:#fdf7f0;border:1px solid #f0dcc4;
  border-radius:9px;padding:7px 9px;display:flex;flex-direction:column;gap:1px}
.senbox span{font-size:10.5px;color:#a07a4a;font-weight:700}
.senbox b{font-size:14px;color:#8a4f08;font-variant-numeric:tabular-nums}
.sennote{font-size:11px;color:var(--ink3);line-height:1.6;margin-top:5px}
/* 選定療養：後発品との差額（カード内の自己負担割合切替） */
.sendiff{margin-top:9px;background:#eef6fd;border:1px solid #b9d8f0;
  border-radius:10px;padding:9px 10px}
.sendiff-h{font-size:11px;font-weight:700;color:#0a5a97;margin-bottom:6px}
.sdratio{display:flex;gap:5px;margin-bottom:7px}
.sdb{flex:1;min-height:34px;padding:0;border-radius:8px;font-size:12.5px;font-weight:700;
  background:#fff;border:1px solid #b9d8f0;color:#0a5a97;cursor:pointer;font-family:inherit}
.sdb[aria-pressed="true"]{background:#0a68b0;border-color:#0a68b0;color:#fff}
.sdresult{font-size:13px;color:#0a5a97;line-height:1.6}
.sdqty{margin-top:9px;padding-top:9px;border-top:1px dashed #b9d8f0}
.sdqty label{display:flex;align-items:center;gap:7px;font-size:12px;
  font-weight:700;color:#0a5a97;flex-wrap:wrap}
.sdq{width:96px;min-height:38px;padding:0 9px;font-size:14px;
  border:1px solid #b9d8f0;border-radius:8px;background:#fff;color:var(--ink);
  font-family:inherit;font-variant-numeric:tabular-nums}
.sdqu{font-size:12px;color:#0a5a97;font-weight:700}
.sdtotal{font-size:13px;color:#0a5a97;line-height:1.7;margin-top:6px}
.sdtotal b{font-size:15px}
.sdcalc{display:block;font-size:11px;color:var(--ink3);font-weight:400}
.sdresult b{font-size:15px}
.kc{display:inline-flex;align-items:center;justify-content:center;height:20px;
  padding:0 6px;border-radius:5px;font-size:11px;font-weight:800;white-space:nowrap;flex:0 0 auto;
  background:#5f34ab;color:#fff}
/* 比較画面の並び替え */
.ovsort{display:flex;gap:6px;padding:9px 12px 0}
.sortb{flex:1;min-height:44px;padding:0 2px;border-radius:9px;font-size:12.5px;font-weight:700;
  background:var(--surface2);border:1px solid var(--line);color:var(--ink2);
